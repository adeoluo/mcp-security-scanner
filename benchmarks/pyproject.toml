[project]
name = "mcpscan-benchmarks"
version = "0.1.0"
description = "Benchmark harness for mcpscan: planted-vulnerability comparison, corpus scan, precision labeling."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "hypothesis>=6.120", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
